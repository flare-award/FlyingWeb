[mod]
id = "flyingweb"
version = "1.0.0"
priority = 100

[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

# Pure-Rust pendulum physics, smart anchor raycasting, dynamic Spider-Cam,
# traversal mechanics, 8 non-lethal Spider-Gadgets, suit atlas, and UI crate.
[[crate]]
id = "flyingweb_core"
path = "flyingweb_core"

# Bridge module mounted inside `horizon-client` (`crate::game::flyingweb_glue`).
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "flyingweb_glue"
visibility = "pub(crate)"
source = "glue.rs"

